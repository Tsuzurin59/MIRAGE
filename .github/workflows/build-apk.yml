name: Build Japanese Dictionary APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v7

      - name: Download and verify dictionary data
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 \
            -o app/src/main/assets/japanese-dictionary.db.zst \
            https://github.com/tomoshi-app/tomoshi-dict-data/releases/download/v2026-09-02/tomoshi-dict-open.db.zst
          echo "7153dfd7a8e42e2d920308370eac90cf9f2e4b4cfe67fb9a86e9aa1c89494073  app/src/main/assets/japanese-dictionary.db.zst" | sha256sum --check -

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 35 build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v7
        with:
          name: JapaneseDictionary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
