plugins { id 'com.android.application' }

android {
    namespace 'com.numazu.dictionary'
    compileSdk 35
    defaultConfig {
        applicationId 'com.numazu.japanesedictionary'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.luben:zstd-jni:1.5.7-7@aar'
}
